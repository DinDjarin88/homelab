modules:
  ups_mib:
    walk:
      - 1.3.6.1.2.1.33.1.2
      - 1.3.6.1.2.1.33.1.3
      - 1.3.6.1.2.1.33.1.4
      - 1.3.6.1.2.1.33.1.9
    metrics:
      - name: ups_battery_status
        oid: 1.3.6.1.2.1.33.1.2.1
        type: gauge
        help: Battery status (1=unknown, 2=normal, 3=low, 4=depleted)
      - name: ups_battery_charge_percent
        oid: 1.3.6.1.2.1.33.1.2.4
        type: gauge
        help: Battery charge percentage
      - name: ups_battery_runtime_minutes
        oid: 1.3.6.1.2.1.33.1.2.3
        type: gauge
        help: Battery remaining runtime in minutes
      - name: ups_battery_temperature_celsius
        oid: 1.3.6.1.2.1.33.1.2.7
        type: gauge
        help: Battery temperature in celsius
      - name: ups_output_load_percent
        oid: 1.3.6.1.2.1.33.1.4.4.1.5.1
        type: gauge
        help: Output load percentage
      - name: ups_output_voltage
        oid: 1.3.6.1.2.1.33.1.4.4.1.2.1
        type: gauge
        help: Output voltage in 0.1V units
      - name: ups_input_voltage
        oid: 1.3.6.1.2.1.33.1.3.3.1.2.1
        type: gauge
        help: Input voltage in 0.1V units
      - name: ups_rated_va
        oid: 1.3.6.1.2.1.33.1.9.5
        type: gauge
        help: UPS rated VA
      - name: ups_rated_watts
        oid: 1.3.6.1.2.1.33.1.9.6
        type: gauge
        help: UPS rated watts
