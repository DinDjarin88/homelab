apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring
data:
  snmp.yml: |
    auths:
      public_v2:
        community: public
        version: 2
    modules:
      ups_mib:
        get:
          - 1.3.6.1.2.1.33.1.2.1.0
          - 1.3.6.1.2.1.33.1.2.3.0
          - 1.3.6.1.2.1.33.1.2.4.0
          - 1.3.6.1.2.1.33.1.2.7.0
          - 1.3.6.1.2.1.33.1.3.3.1.2.1
          - 1.3.6.1.2.1.33.1.4.4.1.2.1
          - 1.3.6.1.2.1.33.1.4.4.1.5.1
        metrics:
          - name: ups_battery_status
            oid: 1.3.6.1.2.1.33.1.2.1
            type: gauge
            help: Battery status
          - name: ups_battery_runtime_minutes
            oid: 1.3.6.1.2.1.33.1.2.3
            type: gauge
            help: Battery remaining runtime in minutes
          - name: ups_battery_charge_percent
            oid: 1.3.6.1.2.1.33.1.2.4
            type: gauge
            help: Battery charge percentage
          - name: ups_battery_temperature_celsius
            oid: 1.3.6.1.2.1.33.1.2.7
            type: gauge
            help: Battery temperature in celsius
          - name: ups_input_voltage
            oid: 1.3.6.1.2.1.33.1.3.3.1.2.1
            type: gauge
            help: Input voltage
          - name: ups_output_voltage
            oid: 1.3.6.1.2.1.33.1.4.4.1.2.1
            type: gauge
            help: Output voltage
          - name: ups_output_load_percent
            oid: 1.3.6.1.2.1.33.1.4.4.1.5.1
            type: gauge
            help: Output load percentage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
      annotations:
        config-revision: "3"
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.30.1
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
          ports:
            - name: http
              containerPort: 9116
          volumeMounts:
            - name: config
              mountPath: /etc/snmp_exporter
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: snmp-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
spec:
  selector:
    app: snmp-exporter
  ports:
    - name: http
      port: 9116
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snmp-ups
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: snmp-exporter
  endpoints:
    - port: http
      path: /snmp
      interval: 60s
      scrapeTimeout: 30s
      params:
        module: [ups_mib]
        auth: [public_v2]
        target: ["192.168.6.111"]
      relabelings:
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: snmp-exporter.monitoring.svc:9116
