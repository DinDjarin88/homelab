apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-config
  namespace: monitoring
data:
  snmp.yml: |
    auths:
      public_v2:
        community: public
        version: 2
    modules:
      ups_mib:
        allow_nonincreasing_oids: true
        walk:
          - 1.3.6.1.2.1.33.1.2
          - 1.3.6.1.2.1.33.1.3
          - 1.3.6.1.2.1.33.1.4
          - 1.3.6.1.2.1.33.1.9
        metrics:
          - name: ups_battery_status
            oid: 1.3.6.1.2.1.33.1.2.1
            type: gauge
            help: Battery status
          - name: ups_battery_charge_percent
            oid: 1.3.6.1.2.1.33.1.2.4
            type: gauge
            help: Battery charge percentage
          - name: ups_battery_runtime_minutes
            oid: 1.3.6.1.2.1.33.1.2.3
            type: gauge
            help: Battery remaining runtime in minutes
          - name: ups_battery_temperature_celsius
            oid: 1.3.6.1.2.1.33.1.2.7
            type: gauge
            help: Battery temperature in celsius
          - name: ups_output_load_percent
            oid: 1.3.6.1.2.1.33.1.4.4.1.5.1
            type: gauge
            help: Output load percentage
          - name: ups_output_voltage
            oid: 1.3.6.1.2.1.33.1.4.4.1.2.1
            type: gauge
            help: Output voltage
          - name: ups_input_voltage
            oid: 1.3.6.1.2.1.33.1.3.3.1.2.1
            type: gauge
            help: Input voltage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snmp-exporter
  template:
    metadata:
      labels:
        app: snmp-exporter
    spec:
      containers:
      - name: snmp-exporter
        image: prom/snmp-exporter:latest
        args:
          - --config.file=/etc/snmp_exporter/snmp.yml
        ports:
        - containerPort: 9116
        volumeMounts:
        - name: config
          mountPath: /etc/snmp_exporter
      volumes:
      - name: config
        configMap:
          name: snmp-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
  labels:
    app: snmp-exporter
spec:
  selector:
    app: snmp-exporter
  ports:
  - name: http
    port: 9116
    targetPort: 9116
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snmp-ups
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
  - port: http
    path: /snmp
    params:
      module: [ups_mib]
      auth: [public_v2]
      target: ["192.168.6.111"]
    relabelings:
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter:9116
  selector:
    matchLabels:
      app: snmp-exporter
